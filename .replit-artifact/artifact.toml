kind = "web"
previewPath = "/"
title = "GameZone Store"
version = "1.0.0"
id = "artifacts/gamezone-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22070

[services.development]
run = "pnpm --filter @workspace/gamezone-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gamezone-store", "run", "build" ]
publicDir = "artifacts/gamezone-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22070"
BASE_PATH = "/"
